name: Build macOS app

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Prepare disposable build source
        run: ditto "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"

      - name: Build app and helper
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme App \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build release app and helper
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme App \
            -configuration Release \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compile Dock-swipe harness
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme Tests \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify checkout was not modified by builds
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- App/SupportFiles/Info.plist Helper/SupportFiles/Info.plist
