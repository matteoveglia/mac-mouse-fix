name: Build macOS app

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Detect macOS 27 SDK
        id: macos27
        run: |
          if xcodebuild -showsdks | grep -Fq 'macOS 27.0'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "macOS 27 SDK is not installed on this hosted runner; the Dock-swipe harness is covered by the documented local Xcode 27 build."
          fi

      - name: Run deterministic remediation tests
        run: |
          xcrun swiftc \
            -DAPPLICATION_POLICY_SELF_TEST_MAIN \
            Shared/Config/ApplicationPolicy.swift \
            Tests/ApplicationPolicyTests.swift \
            -o "$RUNNER_TEMP/application-policy-tests"
          "$RUNNER_TEMP/application-policy-tests"

          xcrun swiftc \
            -DCLICK_CYCLE_STATE_MACHINE_TEST_MAIN \
            Tests/ClickCycleStateMachineTests.swift \
            -o "$RUNNER_TEMP/click-cycle-tests"
          "$RUNNER_TEMP/click-cycle-tests"

          xcrun clang \
            -fobjc-arc \
            -fblocks \
            -framework Foundation \
            -Werror \
            -Wno-unused-parameter \
            -I Shared/Devices/HIDPP \
            -I Tests/HIDPP \
            -DMFHIDPP_FIXTURE_TEST_MAIN \
            Shared/Devices/HIDPP/MFHIDPPTypes.m \
            Shared/Devices/HIDPP/MFHIDPPClient.m \
            Shared/Devices/HIDPP/MFHIDPPFixtureTransport.m \
            Tests/HIDPP/MFHIDPPManualScheduler.m \
            Tests/HIDPP/MFHIDPPSmokeTests.m \
            -o "$RUNNER_TEMP/hidpp-fixture-tests"
          "$RUNNER_TEMP/hidpp-fixture-tests"

          xcrun clang \
            -fobjc-arc \
            -fblocks \
            -framework Foundation \
            -framework CoreGraphics \
            -Werror \
            -Wno-unused-parameter \
            -I Helper/Utility \
            Helper/Utility/MFEventTapHandle.m \
            Tests/MFEventTapHandleTests.m \
            -o "$RUNNER_TEMP/event-tap-handle-tests"
          "$RUNNER_TEMP/event-tap-handle-tests"

          xcrun clang \
            -fobjc-arc \
            -framework Foundation \
            -Werror \
            -I Shared/IOKit \
            Shared/IOKit/MFDockSwipePayload.m \
            Tests/MFDockSwipePayloadTests.m \
            -o "$RUNNER_TEMP/dock-swipe-payload-tests"
          "$RUNNER_TEMP/dock-swipe-payload-tests"

          xcrun clang \
            -fobjc-arc \
            -framework Foundation \
            -Werror \
            -I Shared/IOKit \
            Shared/IOKit/CGEventHIDEventAttachment.m \
            Tests/CGEventHIDEventAttachmentTests.m \
            -o "$RUNNER_TEMP/hid-event-attachment-tests"
          "$RUNNER_TEMP/hid-event-attachment-tests"

          xcrun clang \
            -std=gnu11 \
            -fobjc-arc \
            -framework Foundation \
            -Werror \
            -I Helper/Core/Scroll \
            Helper/Core/Scroll/MFScrollGeneration.m \
            Tests/MFScrollGenerationTests.m \
            -o "$RUNNER_TEMP/scroll-generation-tests"
          "$RUNNER_TEMP/scroll-generation-tests"

          xcrun clang \
            -fobjc-arc \
            -framework Foundation \
            -Werror \
            -I Shared/HelperServices \
            Shared/HelperServices/MFHelperServiceRegistration.m \
            Tests/MFHelperServiceRegistrationTests.m \
            -o "$RUNNER_TEMP/helper-service-registration-tests"
          "$RUNNER_TEMP/helper-service-registration-tests"

      - name: Prepare disposable build source
        run: ditto "$GITHUB_WORKSPACE" "$RUNNER_TEMP/source"

      - name: Build app and helper
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme App \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build release app and helper
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme App \
            -configuration Release \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compile Dock-swipe harness
        if: steps.macos27.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/source
        run: |
          xcodebuild \
            -project "Mouse Fix.xcodeproj" \
            -scheme Tests \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify checkout was not modified by builds
        run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- App/SupportFiles/Info.plist Helper/SupportFiles/Info.plist
